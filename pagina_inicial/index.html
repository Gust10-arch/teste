<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>H-CORE DATA CARD // LAYZON // MULTI-ELECTRON</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&family=JetBrains+Mono:wght@300&display=swap');

        :root {
            --neon-cyan: #0ff;
            --white-glow: #fff;
            --dark-bg: #050505;
            --glass: rgba(255, 255, 255, 0.03);
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 2px 2px, rgba(0, 255, 255, 0.05) 1px, transparent 0);
            background-size: 40px 40px;
            font-family: 'JetBrains Mono', monospace;
            overflow: hidden;
        }

        /* O CARD "CRUEL" */
        .card {
            width: 400px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 20px;
            padding: 2px; /* Espaço para o gradiente da borda */
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5), 0 0 20px rgba(0, 255, 255, 0.1);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--neon-cyan);
        }

        /* ÁREA DO ÁTOMO (TOPO DO CARD) */
        #atomo-container {
            width: 100%;
            height: 300px;
            border-bottom: 1px solid rgba(0, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            border-radius: 18px 18px 0 0;
        }

        /* INFORMAÇÕES (BAIXO DO CARD) */
        .info-container {
            padding: 25px;
            color: #ccc;
        }

        .header-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .header-card h2 {
            margin: 0;
            font-family: 'Orbitron';
            color: var(--neon-cyan);
            font-size: 1.2rem;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
        }

        .tag {
            background: rgba(0, 255, 255, 0.1);
            color: var(--neon-cyan);
            padding: 3px 8px;
            font-size: 10px;
            border-radius: 4px;
            border: 1px solid var(--neon-cyan);
        }

        .description {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #888;
            margin-bottom: 20px;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 15px;
        }

        .data-item {
            font-size: 0.75rem;
        }

        .label { color: var(--neon-cyan); opacity: 0.6; display: block; margin-bottom: 2px; }
        .value { color: #fff; font-weight: bold; }

        /* Botão Estilo HUD */
        .action-btn {
            width: 100%;
            margin-top: 20px;
            background: transparent;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 10px;
            font-family: 'Orbitron';
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 0.7rem;
            outline: none;
        }

        .action-btn:hover {
            background: var(--neon-cyan);
            color: #000;
            box-shadow: 0 0 20px var(--neon-cyan);
        }
    </style>
</head>
<body>

    <div class="card">
        <div id="atomo-container"></div>

        <div class="info-container">
            <div class="header-card">
                <h2>HYDROGEN-MOD</h2>
                <span class="tag">ENHANCED CORE</span>
            </div>
            
            <p class="description">
                Núcleo primordial estabilizado com Múltiplos Elétrons de Alta Energia (M-EHE) para processamento paralelo.
            </p>

            <div class="data-grid">
                <div class="data-item">
                    <span class="label">MASSA ATÔMICA</span>
                    <span class="value">1.008 u++</span>
                </div>
                <div class="data-item">
                    <span class="label">ESTADO</span>
                    <span class="value">PLASMA Q.</span>
                </div>
                <div class="data-item">
                    <span class="label">PRÓTONS</span>
                    <span class="value">01</span>
                </div>
                <div class="data-item">
                    <span class="label">ELÉTRONS (Ativos)</span>
                    <span class="value" style="color: #fff; text-shadow: 0 0 5px #fff;">03</span>
                </div>
            </div>

            <button class="action-btn" onclick="boost()">Iniciar Sobrecarga</button>
        </div>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.161.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        const container = document.getElementById('atomo-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, container.clientWidth / container.clientHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // Melhorar qualidade em telas retina
        container.appendChild(renderer.domElement);

        // --- CONFIGURAÇÕES ---
        const orbitRadius = 6;
        const electronSize = 0.4;
        const coreColor = 0x00ffff;
        const electronColor = 0xffffff; // BRANCO
        let baseSpeed = 0.02; // Velocidade base mais lenta para notar a diferença

        // --- NÚCLEO WIREFRAME ---
        const core = new THREE.Mesh(
            new THREE.IcosahedronGeometry(1.5, 1),
            new THREE.MeshBasicMaterial({ color: coreColor, wireframe: true })
        );
        scene.add(core);

        // --- ÓRBITAS (Visual) ---
        // Criamos 3 anéis visualmente diferentes
        function createOrbitRing(rotationX, rotationY, opacity) {
            const ring = new THREE.Mesh(
                new THREE.TorusGeometry(orbitRadius, 0.03, 16, 100),
                new THREE.MeshBasicMaterial({ color: coreColor, transparent: true, opacity: opacity })
            );
            ring.rotation.x = rotationX;
            ring.rotation.y = rotationY;
            scene.add(ring);
            return ring;
        }

        createOrbitRing(Math.PI / 2, 0, 0.15);      // Órbita Plana
        createOrbitRing(Math.PI / 4, Math.PI / 4, 0.08); // Órbita Inclinada 1
        createOrbitRing(-Math.PI / 4, Math.PI / 4, 0.08);// Órbita Inclinada 2

        // --- ELÉTRONS (As "Bolotas Brancas") ---
        const electronGeometry = new THREE.SphereGeometry(electronSize, 16, 16);
        const electronMaterial = new THREE.MeshBasicMaterial({ color: electronColor });

        // Função para criar um elétron e seu pivô de rotação
        function createElectron(rotX, rotY, initialAngle, speedMult) {
            const electron = new THREE.Mesh(electronGeometry, electronMaterial);
            
            // Adiciona um pequeno brilho (opcional, mas fica legal)
            const light = new THREE.PointLight(electronColor, 1, 10);
            electron.add(light);

            const pivot = new THREE.Group();
            
            // Inclina o pivô para criar órbitas em ângulos diferentes
            pivot.rotation.x = rotX;
            pivot.rotation.y = rotY;
            
            scene.add(pivot);
            pivot.add(electron);
            
            // Posição inicial na órbita
            electron.position.set(orbitRadius, 0, 0);
            
            // Retornamos um objeto com o pivô e sua velocidade única
            return {
                pivot: pivot,
                angle: initialAngle,
                speed: baseSpeed * speedMult
            };
        }

        // Criamos os 3 elétrons com configurações diferentes
        const electrons = [];
        // Elétron 1: Órbita horizontal, velocidade padrão
        electrons.push(createElectron(Math.PI / 2, 0, 0, 1)); 
        // Elétron 2: Inclinado, mais rápido, começa oposto
        electrons.push(createElectron(Math.PI / 4, Math.PI / 4, Math.PI, 1.5)); 
        // Elétron 3: Outra inclinação, velocidade média
        electrons.push(createElectron(-Math.PI / 4, Math.PI / 4, Math.PI / 2, 1.2));

        // --- CÂMERA ---
        camera.position.z = 12; // Afastei um pouco a câmera
        camera.position.y = 3;
        camera.lookAt(0,0,0);

        // --- ANIMAÇÃO ---
        function animate() {
            requestAnimationFrame(animate);

            // Rotacionar o núcleo
            core.rotation.y += 0.005;
            core.rotation.x += 0.005;

            // Atualizar e Rotacionar cada elétron individualmente
            electrons.forEach(el => {
                el.angle += el.speed;
                // Usamos Math.cos e sin para mover o elétron dentro do grupo do pivô
                el.pivot.children[0].position.x = Math.cos(el.angle) * orbitRadius;
                el.pivot.children[0].position.z = Math.sin(el.angle) * orbitRadius;
            });

            renderer.render(scene, camera);
        }

        // --- INTERAÇÃO (BOOST) ---
        window.boost = () => {
            // Aumenta a velocidade de todos
            electrons.forEach(el => el.speed *= 5);
            core.material.color.setHex(0xff0000);
            
            setTimeout(() => { 
                // Restaura velocidades originais
                electrons[0].speed = baseSpeed * 1;
                electrons[1].speed = baseSpeed * 1.5;
                electrons[2].speed = baseSpeed * 1.2;
                core.material.color.setHex(coreColor);
            }, 2000);
        };

        animate();

        // --- REDIMENSIONAMENTO ---
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
